name: Java checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: runner.os != 'Windows'
        run: bash scripts/test.sh
      - if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test.ps1
